# bsc — configuration.
#
# Copy to /etc/bsc/config.yaml. Every setting is listed below with its default,
# so this file is the whole surface: nothing is configurable that is not here.
# Delete what you are happy with — the defaults apply to anything you leave out.
#
# THE ONE THING THAT MUST NOT GO IN THIS FILE IS master_secret. It signs every
# transaction and holds an unlimited allowance on every wallet the service
# derives, so whoever holds it can move every app's money. Keep it in a secrets
# manager and let systemd pass it in as BSC_MASTER_SECRET: the unit loads
# /etc/bsc/bsc.env (0640 root:bsc), which holds that one value and nothing else.
#
# That split is the point of this file. With the secret out of it, everything
# here is safe to review, diff and keep in version control — which is what makes
# "what changed last month" an answerable question about a service that moves
# money on these numbers.
#
# Every setting is also addressable from the environment: the key path in upper
# case with BSC_ in front, so swap.amount_wei is BSC_SWAP_AMOUNT_WEI. The
# environment beats this file, and a command-line flag beats both — which is how
# you override one value during an incident without editing a reviewed file.
#
# Amounts named *_wei are integers in the token's own units, as strings. Amounts
# named *_cents are whole cents. Durations are Go durations: 500ms, 2m, 1h.

# The only datastore: one bbolt file holding apps and their ledgers, wallets,
# deposits and withdrawals. Losing it loses the wallet ids, and with them every
# address ever derived — back it up (see snapshot, below).
db_path: /var/lib/bsc/bsc.db

# The only listener. There is no authentication and there never will be: every
# caller is a first-party service on the same box and the app slug in the path
# is identity, not a credential. Keep it on loopback and never put it behind a
# public reverse proxy.
http_addr: 127.0.0.1:8800

# The local dashboard at /ui/, for driving the service by hand and watching it
# work. Off by default, and that default is a security boundary rather than a
# preference: the listener has no authentication, so anyone who can reach the
# port can move every app's money. A laptop or a box only you can reach, and
# nowhere else.
ui_enabled: false

chain:
  # THE ONE CHAIN INPUT. Everything else chain-shaped follows what this endpoint
  # reports for eth_chainId: the token, the swap router, and the id every
  # signature is bound to. Point it at a testnet node and the whole service
  # follows. There is deliberately no chain_id setting — one that could disagree
  # with the endpoint eventually would, and the failure is a service that reads
  # blocks perfectly and cannot send anything.
  rpc_url: wss://bsc-rpc.publicnode.com

  # Requests per second, shared by everything. MUST clear the block rate with
  # room to spare: at ~0.45s blocks the watcher alone needs ~2.2/s just to keep
  # pace, and it has to outrun the chain to recover from any downtime. At 20/s
  # an hour of downtime clears in about seven minutes. Values below 5 are
  # refused, because a limit that cannot catch up only shows up during an
  # incident.
  rpc_rate_limit: 20

  # Defaults to USDT for whichever chain the endpoint reports. An endpoint on a
  # chain with no built-in default must name this, rather than silently watching
  # an address where no contract exists.
  token_address: ""

  # Only used on a fresh database. 0 means THE CURRENT FINALIZED HEAD, never
  # genesis — starting from block 0 would scan the entire chain.
  start_block: 0

  # How often to poll for a new head once caught up. While behind there is no
  # sleep at all.
  poll_interval: 500ms

  # Blocks per write transaction while catching up.
  backfill_batch: 100

  # Withdrawals are refused while the watcher is further behind than this (~90s
  # at current block times); reads keep working. Reserving against a stale
  # balance could overdraw an app, and "not yet" is the honest answer.
  max_lag_blocks: 200

money:
  # A newly registered app's withdrawal fee. The app may change its own
  # afterwards — this is only the starting value.
  default_fee_cents: 100

  # Where the house's money lands. Empty means the master address.
  fee_collector: ""

  # How much a wallet must hold OVER its app's ledger — fees, sub-cent dust,
  # stray transfers — before one transfer is worth collecting it. 0 disables
  # sweeping entirely, which is safe: the money is still yours and simply
  # accumulates in the app wallets.
  house_sweep_min_cents: 100

  # Pure gas economics: do not spend a transaction moving less than this out of
  # a deposit address. It has NO effect on what an app is credited — anything
  # worth a whole cent is recorded the moment it arrives and shows as pending
  # until the drain is worth running. Do not treat it as a minimum deposit.
  drain_threshold_wei: "1000000000000000000" # 1 USDT

gas:
  # Headroom over the estimated cost of activating a deposit wallet. Keep it
  # modest: unused gas is refunded, so the surplus stays as dust in each
  # address. These two multipliers are the ONLY gas knobs — amounts themselves
  # are always estimated, never configured.
  funding_multiplier: 1.25
  price_multiplier: 1.10

  # How long an unconfirmed transaction waits before the same signed bytes are
  # re-sent. It is never re-signed: that could double-spend.
  rebroadcast_after: 2m

  # How often the master's native-balance gauge refreshes.
  master_poll: 30s

swap:
  # Trade collected fees back into native currency when the master runs low, so
  # the fees withdrawals earn pay for the gas withdrawals cost. On by default —
  # a gateway that runs out of gas stops completely — but it is the only thing
  # the service does on its own initiative, so it is bounded on every side.
  enabled: true

  # A Uniswap-V2-interface router. Defaults to the verified PancakeSwap V2
  # deployment for whichever chain the endpoint reports; an unknown chain must
  # name one here or set enabled: false.
  router: ""

  # Override only, for a fork whose router names the accessor something other
  # than WETH(). Normally unset: the router is asked, and cannot then disagree
  # with itself.
  wrapped_native: ""

  # Tokens traded per top-up.
  amount_wei: "10000000000000000000" # 10 USDT

  # Native balance below which a top-up is due. Well above the cost of the swap
  # itself — below that, the master could not afford to rescue itself.
  gas_floor_wei: "50000000000000000" # 0.05 BNB

  # Bound on the price, computed against the router's own quote. 10000 would
  # accept any price at all and is refused.
  slippage_bps: 100 # 1%

  # Minimum gap between attempts. This is what stops a swap that does not lift
  # the balance from trading away every fee it holds.
  cooldown: 1h

snapshot:
  # Periodic consistent copies of the whole database. EMPTY DISABLES BACKUP —
  # set it. Losing the database loses the wallet ids, and without them every
  # address ever derived is unrecoverable even though you still hold the master
  # secret. Ship the copies off the machine; they are plaintext, so encrypt them
  # at whatever ships them.
  dir: /var/backups/bsc
  interval: 1h
  keep: 24

log:
  # debug, info, warn or error. Logs are JSON.
  level: info

# master_secret is NOT set here, and setting it here would be a mistake. It is
# read from the environment as BSC_MASTER_SECRET — see the comment at the top of
# this file, and deploy/README.md for where the unit loads it from.
