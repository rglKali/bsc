# bsc — Prometheus scrape fragment. Included by the host's prometheus.yml via
# `scrape_config_files`, so bsc owns its own scrape config. Holds ONLY
# scrape_configs (no global block).
#
# One process, one target. bsc has no public route — it listens on loopback and
# is called by other services on the same box — so this is scraped over loopback
# too. Series are all under a single bsc_* namespace.
scrape_configs:
  - job_name: bsc
    static_configs:
      - targets: ["127.0.0.1:8800"]
